<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>照夜塔 · 联机战斗</title><link rel="stylesheet" href="style.css">
<main><header><div><small>剑阁 / 联机试炼</small><h1>照夜塔</h1></div><a href="offline.html">离线试玩</a></header>
<form id="login"><label>Gate 地址<input id="address" type="url" value="ws://127.0.0.1:8001/ws" required></label><label>区服<input id="server" type="number" min="1" max="4294967295" value="1" required></label><label>账号<input id="account" autocomplete="username" required></label><label>密码<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">登录</button><button type="submit" value="register">注册并登录</button></form>
<section class="arena"><canvas aria-label="联机战场"></canvas><div class="overlay"><div><small id="session">尚未连接</small><h2 id="place">山门</h2></div><button id="start" disabled>进入战斗</button></div></section>
<section class="hud"><div class="player"><small>我方剑修</small><h3 id="hero">执剑人</h3><progress id="hp" value="0" max="1"></progress><output id="life">等待入场</output><div id="gear"></div></div><div><small>锁定敌方</small><div id="targets"></div></div></section>
<div id="grants"></div><button id="auto" aria-pressed="false" disabled>开启自动</button><div id="actions"></div><footer><span id="log" role="status">登录后可进入当前爬塔关卡。</span><button id="retry-input" hidden>重试本次出招</button><button id="disconnect" hidden>断开连接</button></footer></main>
<script src="scene.js"></script><script src="wire.js"></script><script src="online.js"></script></html>
