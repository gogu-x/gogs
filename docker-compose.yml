services:
  battle-1:
    build:
      context: .
      dockerfile: battle.Dockerfile
    command: ["--server-id", "1", "--node-id", "1", "--battle-host", "battle-1", "--mongo-url", "mongodb://mongodb:27017", "--mongo-username", "${MONGO_ROOT_USERNAME}", "--mongo-password", "${MONGO_ROOT_PASSWORD}", "--etcd", "etcd:2379", "--nats-url", "nats://nats:4222"]
    ports:
      - "10901:10901"
    depends_on:
      - etcd
      - mongodb
      - nats
    restart: unless-stopped

