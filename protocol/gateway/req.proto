syntax = "proto3";

option go_package = "github.com/gogu-x/gogs/pb/pb_gateway";

message LoginReq {
  string account   = 1;
  string password  = 2;
  uint32  server_id = 3;
}

message RegisterReq {
  string account   = 1;
  string password  = 2;
  uint32  server_id = 3;
}

message LogoutReq {
}

// GetServerListReq may be sent before login to discover an account's registrations.
message GetServerListReq {
  string account = 1;
}
