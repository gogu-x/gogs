syntax = "proto3";

option go_package = "github.com/gogu-x/gogs/pb/protoGateway";

message LoginReq {
  string account   = 1;
  string password  = 2;
  int32  server_id = 3;
}

message RegisterReq {
  string account   = 1;
  string password  = 2;
  int32  server_id = 3;
}

message LogoutReq {
  uint64 uid = 1;
}

// GetServerListReq may be sent before login to discover an account's registrations.
message GetServerListReq {
  string account = 1;
}


message LoginGameReq {
  uint64 uid = 1;
  int32  server_id = 2;
}
