syntax = "proto3";

option go_package = "github.com/gogu-x/gogs/pb/pb_gateway";

// 通用消息帧，Gate↔Game gRPC 传输单元
message Frame {
  bytes  payload    = 1;
}

message ServerAccount {
  uint32  server_id = 1;
  uint64 uid       = 2;
}

service Gateway {
  rpc Stream(stream Frame) returns (stream Frame);
}
