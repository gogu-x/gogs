syntax = "proto3";

option go_package = "github.com/gogu-x/gogs/pb/protoGateway";

import "common/error.proto";

message LoginAck {
  ErrCode code = 1;
  string  msg  = 2;
}

message RegisterAck {
  ErrCode code = 1;
  string  msg  = 2;
}

message ServerAccount {
  int32  server_id = 1;
  uint64 uid       = 2;
}

message ServerListAck {
  ErrCode  code   = 1;
  repeated ServerAccount accounts = 2;
}

message LoginGameAck {
  ErrCode  code  = 1;
  uint64   uid   = 2;
}